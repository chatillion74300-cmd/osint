<text x="1200" y="263" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >1ʳᵉ heure après le lever du soleil le jeudi</text>
<text x="1078" y="289" font-size="15" fill="#9cc3e4" text-anchor="start" font-weight="normal" ></text>
<text x="1200" y="289" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >(heures planétaires, ordre chaldéen)</text>
<text x="1078" y="315" font-size="15" fill="#9cc3e4" text-anchor="start" font-weight="normal" >Domiciles</text>
<text x="1200" y="315" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >♐ Sagittaire · ♓ Poissons</text>
<text x="1078" y="341" font-size="15" fill="#9cc3e4" text-anchor="start" font-weight="normal" >Exaltation</text>
<text x="1200" y="341" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >♋ Cancer</text>
<text x="1078" y="367" font-size="15" fill="#9cc3e4" text-anchor="start" font-weight="normal" >Intelligence</text>
<text x="1200" y="367" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >Iophiel = 10+5+80+10+1+30 = 136</text>
<text x="1078" y="393" font-size="15" fill="#9cc3e4" text-anchor="start" font-weight="normal" ></text>
<text x="1200" y="393" font-size="16" fill="#ffffff" text-anchor="end" font-weight="normal" direction="rtl" unicode-bidi="embed">יהפיאל</text>
<text x="1078" y="419" font-size="15" fill="#9cc3e4" text-anchor="start" font-weight="normal" >Esprit</text>
<text x="1200" y="419" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >Hismael = 5+60+40+1+30 = 136</text>
<text x="1078" y="445" font-size="15" fill="#9cc3e4" text-anchor="start" font-weight="normal" ></text>
