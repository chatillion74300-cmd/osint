<text x="610" y="507" font-size="17" fill="#ffffff" text-anchor="start" font-weight="bold" >Y-H-P-Y-A-L</text>
<text x="790" y="507" font-size="19" fill="#ffffff" text-anchor="start" font-weight="bold" direction="rtl" unicode-bidi="embed">יהפיאל</text>
<text x="610" y="533" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >Gématrie : 10 + 5 + 80 + 10 + 1 + 30 = 136</text>
<text x="610" y="555" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >Réduction à 1–16 (zéros retirés) :</text>
<text x="610" y="577" font-size="15" fill="#ffd479" text-anchor="start" font-weight="normal" >10 → 5 → 8 → 10 → 1 → 3</text>
<text x="610" y="607" font-size="13" fill="#9cc3e4" text-anchor="start" font-weight="normal" >○ = départ · ▶ = arrivée · pastilles = ordre des étapes.</text>
<text x="610" y="626" font-size="13" fill="#9cc3e4" text-anchor="start" font-weight="normal" >Tracé reconstruit ici par la méthode de réduction ;</text>
<text x="610" y="645" font-size="13" fill="#9cc3e4" text-anchor="start" font-weight="normal" >ce n’est pas une copie du sceau gravé chez Agrippa.</text>
