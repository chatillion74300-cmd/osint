<text x="70" y="582" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >Nombres 1 à 16, chacun une seule fois.</text>
<text x="70" y="606" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >4 lignes, 4 colonnes, 2 diagonales : toutes = 34.</text>
<text x="70" y="630" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >Somme totale : 1 + 2 + … + 16 = 136.</text>
<text x="70" y="654" font-size="15" fill="#ffffff" text-anchor="start" font-weight="normal" >Constante d’un carré d’ordre n : n(n²+1)/2 = 4·17/2 = 34.</text>
